services:
  postgres:
    image: ghusta/postgres-world-db:2.15.0
    environment:
      POSTGRES_PASSWORD: world123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world -d world-db"]
      interval: 2s
      timeout: 5s
      retries: 10

  postgres-ssl:
    image: ghusta/postgres-world-db:2.15.0
    environment:
      POSTGRES_PASSWORD: world123
    ports:
      - "5433:5432"
    volumes:
      - ./init-postgres-ssl/entrypoint.sh:/usr/local/bin/custom-entrypoint.sh
      - ./init-postgres-ssl/enable-ssl.sh:/docker-entrypoint-initdb.d/99-enable-ssl.sh
    entrypoint: ["/usr/local/bin/custom-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world -d world-db"]
      interval: 2s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: world-db
      MYSQL_USER: world
      MYSQL_PASSWORD: world123
    ports:
      - "3306:3306"
    volumes:
      - ./init-mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost && mysql -u world -pworld123 world-db -e 'SELECT 1 FROM country LIMIT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "World123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'World123!' -C -Q 'SELECT 1' || exit 1",
      ]
      interval: 5s
      timeout: 10s
      retries: 20

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./init-mssql:/init
    entrypoint: ["/bin/bash", "/init/init.sh"]

  sqlite-init:
    image: keinos/sqlite3:3.53.2
    volumes:
      - ./init-sqlite:/init
      - /tmp/sqlr-sqlite:/data
    entrypoint: [
      "/bin/sh",
      "-c",
      "rm -f /data/world.db && sqlite3 /data/world.db < /init/01-schema.sql && chmod 666 /data/world.db",
    ]

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    environment:
      CLICKHOUSE_DB: world
      CLICKHOUSE_USER: world
      CLICKHOUSE_PASSWORD: world123
    ports:
      - "8123:8123"
    volumes:
      - ./init-clickhouse:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://localhost:8123/?query=SELECT+1+FROM+world.country+LIMIT+1&user=world&password=world123' || exit 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
