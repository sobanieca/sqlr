services:
  postgres:
    image: ghusta/postgres-world-db
    environment:
      POSTGRES_PASSWORD: world123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world -d world-db"]
      interval: 2s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: world-db
      MYSQL_USER: world
      MYSQL_PASSWORD: world123
    ports:
      - "3306:3306"
    volumes:
      - ./init-mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "World123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'World123!' -C -Q 'SELECT 1' || exit 1",
      ]
      interval: 5s
      timeout: 10s
      retries: 20

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./init-mssql:/init
    entrypoint: ["/bin/bash", "/init/init.sh"]

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: world
      CLICKHOUSE_USER: world
      CLICKHOUSE_PASSWORD: world123
    ports:
      - "8123:8123"
    volumes:
      - ./init-clickhouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
